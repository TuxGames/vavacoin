{% extends "base.html" %}
{% block titulo %}Caladinho — VavaCoin{% endblock %}
{% block estilos %}
  <link rel="stylesheet" href="{{ url_for('static', filename='caladinho.css') }}">
{% endblock %}
{% block conteudo %}
<div class="caladinho">
  <h1>Caladinho</h1>

  <div class="cal-card">
    {% if caixa is not none %}
    <div class="cal-stats">
      <div>Caixa da casa: <b>{{ caixa }}</b> VVC</div>
    </div>
    {% endif %}
    <h2>Jogos</h2>
    <div class="cal-jogos">
      <a class="cal-btn cal-btn-verde" href="{{ url_for('caladinho.mines') }}">💣 Mines</a>
    </div>
  </div>
</div>
{% endblock %}
