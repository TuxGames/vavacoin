{% extends "base.html" %}
{% block titulo %}Caladinho — VavaCoin{% endblock %}
{% block conteudo %}
<h1>Caladinho</h1>

{% if caixa is not none %}
<dl class="numeros">
  <div class="numero"><dt>Caixa da casa</dt><dd>{{ caixa }} VVC</dd></div>
</dl>
{% endif %}

<div class="card">
  <div class="section-title"><i class="ti ti-dice" aria-hidden="true"></i>Jogos</div>
  <a class="btn btn-gold btn-full" href="{{ url_for('caladinho.mines') }}">Mines</a>
</div>
{% endblock %}
